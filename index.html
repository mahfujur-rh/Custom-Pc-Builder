<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Custom PC Builder</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h1>Custom PC Builder</h1>
            <div class="card">
                <div class="selected-build">
                    <span>Selected Build</span>
                    <span id="buildStatus" class="build-status">None</span>
                </div>
                <label>Build Name</label>
                <input id="buildName" type="text" placeholder="My Gaming PC">

                <div class="grid">
                    <div><label>CPU</label><select id="cpu"></select></div>
                    <div><label>Motherboard</label><select
                            id="motherboard"></select></div>
                    <div><label>GPU</label><select id="gpu"></select></div>
                    <div><label>RAM</label><select id="ram"></select></div>
                    <div><label>Storage</label><select
                            id="storage"></select></div>
                    <div><label>PSU</label><select id="psu"></select></div>
                    <div><label>Case</label><select id="case"></select></div>
                </div>

                <div id="compatibility" class="status">Select CPU and
                    Motherboard</div>

                <h2>Build Summary</h2>
                <table>
                    <tbody id="summary"></tbody>
                    <tfoot><tr><th>Total Price</th><th
                                id="total">৳0</th></tr></tfoot>
                </table>

                <div class="buttons">
                    <button type="button" id="saveBtn">Save Build</button>
                    <button type="button" id="updateBtn">Update Build</button>
                    <button type="button" id="deleteBtn">Delete Build</button>
                    <button type="button" id="clearBtn">Clear Build</button>
                </div>
            </div>
            <div class="card">
                <h2>Saved Builds</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Build Name</th>
                            <th>Total Price</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="savedBuildsList">
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="footer">
            <p>
        © 2026 Custom PC Builder System | Developed by
        Mahfujur Rahman • Wahaj Rashid Arian • Md Tanvir Mahmud
    </p>
        </footer>
        <script src="java.js"></script>
    </body>
</html>
